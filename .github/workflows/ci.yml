name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository. gitleaks-action lists PR commits
# through the API, which needs pull-requests: read.
permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit so a moved tag can't change what runs here.
      # Dependabot (github-actions ecosystem) keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # needed for gitleaks-action to scan commit diffs
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: npm audit
        run: node scripts/audit-gate.mjs
      - run: npm run typecheck
      # In Next 16, next build does not run lint. Without this step
      # lint runs nowhere (same reason as acro-finder / service-anatomy).
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - name: Lighthouse regression guard
        run: |
          npm start & disown
          timeout 30 bash -c 'until curl -sf http://localhost:3000/ja >/dev/null; do sleep 1; done'
          node scripts/lighthouse-ci.mjs
